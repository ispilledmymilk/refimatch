name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install packages
        run: |
          python -m pip install -U pip
          pip install -e packages/scoring[dev]
          pip install -e services/agent[dev]
          pip install -r services/api/requirements.txt

      - name: Ruff
        run: |
          python -m pip install ruff
          ruff check .

      - name: Tests
        env:
          REFIMATCH_LLM_MOCK: "1"
        run: |
          pytest -q packages/scoring/tests services/agent/tests

      - name: Optional DeepEval (skipped by default)
        env:
          REFIMATCH_LLM_MOCK: "1"
        run: |
          pip install -r eval/requirements.txt
          pytest -q eval/deepeval_suite.py

      - name: Promptfoo smoke
        run: npx --yes promptfoo@latest eval -c eval/promptfooconfig.yaml
