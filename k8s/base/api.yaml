apiVersion: v1
kind: Service
metadata:
  name: refimatch-api
  namespace: refimatch
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: refimatch-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: refimatch-api
  namespace: refimatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: refimatch-api
  template:
    metadata:
      labels:
        app: refimatch-api
    spec:
      initContainers:
        - name: wait-for-rag
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: refimatch-secrets
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for i in $(seq 1 120); do
                cnt="$(psql "$DATABASE_URL" -tAc "select count(*) from rag_documents" 2>/dev/null || echo 0)"
                if [ "${cnt:-0}" -ge 1 ]; then exit 0; fi
                sleep 3
              done
              echo "timed out waiting for rag_documents"
              exit 1
      containers:
        - name: api
          image: refimatch-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: refimatch-config
            - secretRef:
                name: refimatch-secrets
